name: "بک‌تست روی داده‌ی واقعی ۱ دقیقه"

on:
  workflow_dispatch:
    inputs:
      days:
        description: "چند روز گذشته (حداکثر ۲۹؛ Yahoo فقط ۳۰ روز اخیر ۱ دقیقه‌ای می‌دهد)"
        default: "20"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: بک‌تست
        run: python tools/backtest.py --days "${{ inputs.days }}" --charts 15
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest-result
          path: backtest_out
